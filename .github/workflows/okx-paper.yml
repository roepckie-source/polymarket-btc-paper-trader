
name: OKX BTC Spot Paper Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: okx-btc-paper
  cancel-in-progress: false

jobs:
  paper-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest -v
          pytest -q

      - name: Run one paper evaluation
        run: python -c "from okx_spot_paper import run_once; run_once()"

      - name: Persist paper state and trades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add okx_paper_state.json okx_paper_trades.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update OKX paper trading state"
            git push origin HEAD:main
          else
            echo "No paper state or trade changes to commit."
          fi

      - name: Upload paper log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-btc-paper-log
          path: |
            okx_paper_state.json
            okx_paper_trades.csv
          if-no-files-found: warn

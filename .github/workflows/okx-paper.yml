name: OKX BTC Spot Paper Check - 2 Hours

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-btc-paper
  cancel-in-progress: false

jobs:
  paper-check:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest -v
      - name: Run pytest if installed
        run: |
          if python -m pytest --version >/dev/null 2>&1; then
            python -m pytest -q
          else
            echo "pytest not installed; skipping."
          fi
      - name: Run paper trading for two hours
        shell: bash
        run: |
          set -euo pipefail
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + 7200))
          NEXT_RUN=$START_TIME
          RUN_COUNT=0
          echo "Starting 2-hour BTC paper trading test. Paper only; no real orders."
          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            RUN_COUNT=$((RUN_COUNT + 1))
            echo "========================================"
            echo "Paper evaluation number: $RUN_COUNT"
            date -u
            # A risk halt or runtime error must fail the workflow, not just break the loop.
            if ! python - <<'PY'
          from okx_spot_paper import run_once
          state, result = run_once()
          if state.get("halted") or result.get("action") == "HALTED":
              print("RISK HALT: " + str(state.get("halt_reason") or result.get("reason") or "unknown cause"))
              raise SystemExit(3)
          PY
            then
              echo "ERROR: paper evaluation failed or safety halt is active. Review saved state and logs."
              exit 1
            fi
            echo "Evaluation completed without a safety halt."
            NEXT_RUN=$((NEXT_RUN + 300))
            NOW=$(date +%s)
            if [ "$NOW" -ge "$END_TIME" ]; then break; fi
            SLEEP_FOR=$((NEXT_RUN - NOW))
            if [ "$SLEEP_FOR" -gt 0 ]; then
              REMAINING=$((END_TIME - NOW))
              if [ "$SLEEP_FOR" -gt "$REMAINING" ]; then SLEEP_FOR=$REMAINING; fi
              sleep "$SLEEP_FOR"
            fi
          done
          echo "Paper test loop completed."
          echo "Total evaluation attempts: $RUN_COUNT"
      - name: Check paper files
        if: always()
        run: |
          if [ -f okx_paper_state.json ]; then cat okx_paper_state.json; else echo "WARNING: paper state missing"; fi
          if [ -f okx_paper_trades.csv ]; then cat okx_paper_trades.csv; else echo "WARNING: paper trades missing"; fi
      - name: Persist paper state and trades
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ ! -f okx_paper_state.json ] || git add okx_paper_state.json
          [ ! -f okx_paper_trades.csv ] || git add okx_paper_trades.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save OKX paper test results"
            git push origin HEAD:main
          else
            echo "No paper files changed."
          fi
      - name: Upload paper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-btc-paper-2-hour-results
          path: |
            okx_paper_state.json
            okx_paper_trades.csv
          if-no-files-found: warn
          retention-days: 30

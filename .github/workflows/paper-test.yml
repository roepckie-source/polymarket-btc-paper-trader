
name: Paper Trading Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - fee-test
          - mexc-test
          - forsee-test
          - forsee-strategy-test
          - 2hours
          - historical-backtest
          - okx-gap-audit

jobs:
  paper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      # ============================================================
      # STRATEGY TEST
      # ============================================================
      - name: Test strategy
        run: |
          python strategy.py

      # ============================================================
      # HISTORICAL BACKTEST UNIT TESTS
      # ============================================================
      - name: Test historical backtest
        run: |
          python -m unittest test_historical_backtest.py

      # ============================================================
      # HISTORICAL BACKTEST (CSV REQUIRED)
      # ============================================================
      - name: Run historical backtest
        if: ${{ inputs.mode == 'historical-backtest' }}
        run: |
          echo "HISTORICAL PAPER BACKTEST — NO ORDERS PLACED"

          if [ ! -f historical_btc_5m.csv ]; then
            echo "ERROR: historical_btc_5m.csv is missing."
            echo "Upload a real dataset with pre-resolution snapshots and final UP/DOWN outcomes."
            echo "historical_btc_5m_TEMPLATE.csv is only a template, not historical data."
            exit 1
          fi

          python historical_backtest.py historical_btc_5m.csv \
            --output historical_backtest_results.csv \
            --fee-rate 0.01 \
            --slippage-per-contract 0.001

      - name: Upload historical backtest results
        if: ${{ always() && inputs.mode == 'historical-backtest' && hashFiles('historical_backtest_results.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-results
          path: historical_backtest_results.csv
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # PAPER TRADER TEST
      # ============================================================
      - name: Test paper trader
        run: |
          python test_paper.py

      # ============================================================
      # CROSS-MARKET PAPER SIGNAL TESTS
      # ============================================================
      - name: Test cross-market paper signal logic
        run: |
          python -m pytest -q test_cross_market_paper.py

      # ============================================================
      # BTC MARKET DATA
      # ============================================================
      - name: Test BTC market data
        run: |
          python market_data.py

      # ============================================================
      # POLYMARKET DATA
      # ============================================================
      - name: Test Polymarket market data
        run: |
          python polymarket_data.py

      # ============================================================
      # KRAKEN DATA
      # ============================================================
      - name: Test Kraken BTC 5M data
        run: |
          python kraken_test.py

      # ============================================================
      # MEXC TEST
      # ============================================================
      - name: Test MEXC BTC 5M
        if: ${{ inputs.mode == 'mexc-test' }}
        run: |
          echo "MEXC BTC 5M TEST"
          echo "READ ONLY — NO ORDERS"
          python mexc_prediction_data.py

      # ============================================================
      # FORSEE READ-ONLY TEST
      # ============================================================
      - name: Test Forsee BTC 5M
        if: ${{ inputs.mode == 'forsee-test' }}
        env:
          FORSEE_API_KEY: ${{ secrets.FORSEE_API_KEY }}
        run: |
          echo "FORSEE BTC 5M READ-ONLY TEST"
          echo "ORDERS DISABLED — WALLET NOT USED — PAPER ONLY"
          python forsee_prediction_data.py

      # ============================================================
      # FORSEE STRATEGY TEST
      # ============================================================
      - name: Test Forsee strategy
        if: ${{ inputs.mode == 'forsee-strategy-test' }}
        env:
          FORSEE_API_KEY: ${{ secrets.FORSEE_API_KEY }}
        run: |
          echo "FORSEE BTC 5M STRATEGY TEST"
          echo "PAPER ONLY — NO ORDERS — NO BETS — NO WALLET"
          python forsee_strategy.py

      # ============================================================
      # POLYMARKET FEE TEST
      # ============================================================
      - name: Test Polymarket fee API
        if: ${{ inputs.mode == 'fee-test' }}
        run: |
          python - <<'PY'
          from polymarket_data import get_market_data
          from paper_live import get_fee_info

          print("=" * 60)
          print("POLYMARKET FEE API TEST")
          print("=" * 60)

          market = get_market_data()
          condition_id = market.get("condition_id")
          token_ids = market.get("token_ids") or []

          print(f"Condition ID: {condition_id}")
          print(f"Token IDs:    {token_ids}")

          if not condition_id:
              raise RuntimeError("No condition_id found")

          if not token_ids:
              raise RuntimeError("No token IDs found")

          token_id = token_ids[0]
          print(f"Using token ID: {token_id}")

          fee_info = get_fee_info(
              condition_id=condition_id,
              token_id=token_id,
          )

          if not fee_info:
              raise RuntimeError("No fee information returned")

          print("FEE INFORMATION")
          print("-" * 60)
          print(f"Fee rate:   {fee_info.get('fee_rate')}")
          print(f"Fee rate %: {fee_info.get('fee_rate_percent')}")
          print(f"Fee BPS:    {fee_info.get('fee_bps')}")
          print(f"Source:     {fee_info.get('source')}")
          print("FEE TEST COMPLETE")
          PY

      # ============================================================
      # OKX GAP AUDIT — READ ONLY
      # ============================================================
      - name: Run OKX historical gap audit
        if: ${{ inputs.mode == 'okx-gap-audit' }}
        run: |
          echo "OKX BTC-USDT HISTORICAL GAP AUDIT"
          echo "READ ONLY — NO ORDERS"
          echo "NO STATE RESET — NO HALT OVERRIDE"

          if [ ! -f okx_gap_audit.py ]; then
            echo "ERROR: okx_gap_audit.py is missing."
            exit 1
          fi

          if [ ! -f okx_paper_state.json ]; then
            echo "ERROR: okx_paper_state.json is missing."
            exit 1
          fi

          python okx_gap_audit.py okx_paper_state.json \
            --output okx_gap_audit.csv

      - name: Upload OKX gap audit report
        if: ${{ always() && inputs.mode == 'okx-gap-audit' && hashFiles('okx_gap_audit.csv') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: okx-gap-audit-report
          path: okx_gap_audit.csv
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # SINGLE PAPER TEST
      # ============================================================
      - name: Single paper test
        if: ${{ inputs.mode == 'single' }}
        run: |
          echo "SINGLE PAPER TEST"
          echo "PAPER ONLY — NO LIVE TRADING — NO REAL ORDERS"
          python paper_live.py

      # ============================================================
      # 2 HOUR PAPER RUN
      # ============================================================
      - name: 2 hour paper run
        if: ${{ inputs.mode == '2hours' }}
        run: |
          echo "2 HOUR PAPER TRADING RUN"
          echo "24 CHECKS — APPROXIMATELY 5 MINUTES BETWEEN CHECKS"
          echo "PAPER ONLY — NO LIVE TRADING — NO REAL ORDERS"

          for i in $(seq 1 24); do
            echo "============================================================"
            echo "PAPER RUN $i / 24"
            echo "============================================================"

            python paper_live.py

            if [ "$i" -lt 24 ]; then
              echo "Waiting 300 seconds until next check..."
              sleep 300
            fi
          done

          echo "2 HOUR PAPER RUN COMPLETE"

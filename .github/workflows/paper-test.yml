name: Paper Trading Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - fee-test
          - mexc-test
          - forsee-test
          - 2hours

jobs:
  paper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ============================================================
      # STRATEGY TESTS
      # ============================================================

      - name: Test strategy
        run: |
          python strategy.py

      # ============================================================
      # PAPER TRADER TESTS
      # ============================================================

      - name: Test paper trader
        run: |
          python test_paper.py

      # ============================================================
      # MARKET DATA TEST
      # ============================================================

      - name: Test BTC market data
        run: |
          python market_data.py

      # ============================================================
      # POLYMARKET DATA TEST
      # ============================================================

      - name: Test Polymarket market data
        run: |
          python polymarket_data.py

      # ============================================================
      # KRAKEN DATA TEST
      # ============================================================

      - name: Test Kraken BTC 5M data
        run: |
          python kraken_test.py

      # ============================================================
      # MEXC TEST
      # ============================================================

      - name: Test MEXC BTC 5M
        if: github.event.inputs.mode == 'mexc-test'
        run: |
          python mexc_prediction_data.py

      # ============================================================
      # FORSEE TEST - READ ONLY
      # ============================================================

      - name: Test Forsee BTC 5M
        if: github.event.inputs.mode == 'forsee-test'
        env:
          FORSEE_API_KEY: ${{ secrets.FORSEE_API_KEY }}
        run: |
          echo "============================================================"
          echo "FORSEE BTC 5M READ-ONLY TEST"
          echo "============================================================"
          echo ""
          echo "API KEY: PROVIDED THROUGH GITHUB SECRET"
          echo "ORDERS: DISABLED"
          echo "WALLET: NOT USED"
          echo "PAPER ONLY"
          echo ""

          python forsee_prediction_data.py

      # ============================================================
      # FEE TEST
      # ============================================================

      - name: Test Polymarket fee API
        if: github.event.inputs.mode == 'fee-test'
        run: |
          python - <<'PY'
          import os
          import requests

          from polymarket_data import get_market_data
          from paper_live import get_fee_info

          print("=" * 60)
          print("POLYMARKET FEE API TEST")
          print("=" * 60)
          print()

          market = get_market_data()

          condition_id = market.get("condition_id")
          token_ids = market.get("token_ids") or []

          print(f"Condition ID: {condition_id}")
          print(f"Token IDs:    {token_ids}")
          print()

          if not condition_id:
              raise RuntimeError("No condition_id found")

          if not token_ids:
              raise RuntimeError("No token IDs found")

          token_id = token_ids[0]

          print(f"Using token ID: {token_id}")
          print()

          fee_info = get_fee_info(
              condition_id=condition_id,
              token_id=token_id,
          )

          print("FEE INFORMATION")
          print("-" * 60)

          if not fee_info:
              raise RuntimeError("No fee information returned")

          print(f"Fee rate:     {fee_info.get('fee_rate')}")
          print(f"Fee rate %:   {fee_info.get('fee_rate_percent')}")
          print(f"Fee BPS:      {fee_info.get('fee_bps')}")
          print(f"Source:       {fee_info.get('source')}")

          print()
          print("=" * 60)
          print("FEE TEST COMPLETE")
          print("=" * 60)
          PY

      # ============================================================
      # SINGLE PAPER TEST
      # ============================================================

      - name: Single paper test
        if: github.event.inputs.mode == 'single'
        run: |
          echo "============================================================"
          echo "SINGLE PAPER TEST"
          echo "============================================================"
          echo ""
          echo "PAPER ONLY"
          echo "NO LIVE TRADING"
          echo "NO REAL ORDERS"
          echo ""

          python paper_live.py

      # ============================================================
      # 2 HOUR PAPER RUN
      # ============================================================

      - name: 2 hour paper run
        if: github.event.inputs.mode == '2hours'
        run: |
          echo "============================================================"
          echo "2 HOUR PAPER TRADING RUN"
          echo "============================================================"
          echo ""
          echo "24 CHECKS"
          echo "APPROXIMATELY 5 MINUTES BETWEEN CHECKS"
          echo "PAPER ONLY"
          echo "NO LIVE TRADING"
          echo "NO REAL ORDERS"
          echo ""

          for i in $(seq 1 24)
          do
            echo ""
            echo "============================================================"
            echo "PAPER RUN $i / 24"
            echo "============================================================"
            echo ""

            python paper_live.py

            if [ "$i" -lt 24 ]; then
              echo ""
              echo "Waiting 300 seconds until next check..."
              sleep 300
            fi
          done

          echo ""
          echo "============================================================"
          echo "2 HOUR PAPER RUN COMPLETE"
          echo "============================================================"

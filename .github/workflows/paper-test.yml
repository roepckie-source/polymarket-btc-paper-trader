
name: Paper Trading Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - fee-test
          - mexc-test
          - forsee-test
          - forsee-strategy-test
          - 2hours
          - historical-backtest
          - polymarket-30m-paper

permissions:
  contents: read

jobs:
  paper-test:
    if: ${{ inputs.mode != 'polymarket-30m-paper' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Test strategy
        run: python strategy.py

      - name: Test historical backtest
        run: python -m unittest test_historical_backtest.py

      - name: Run historical backtest
        if: inputs.mode == 'historical-backtest'
        run: |
          echo "HISTORICAL PAPER BACKTEST — NO ORDERS PLACED"

          if [ ! -f historical_btc_5m.csv ]; then
            echo "ERROR: historical_btc_5m.csv is missing."
            echo "A real historical dataset is required."
            exit 1
          fi

          python historical_backtest.py historical_btc_5m.csv \
            --output historical_backtest_results.csv \
            --fee-rate 0.01 \
            --slippage-per-contract 0.001

      - name: Upload historical backtest results
        if: always() && inputs.mode == 'historical-backtest' && hashFiles('historical_backtest_results.csv') != ''
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-results
          path: historical_backtest_results.csv
          if-no-files-found: error
          retention-days: 30

      - name: Test paper trader
        run: python test_paper.py

      - name: Test cross-market paper signal logic
        run: python -m pytest -q test_cross_market_paper.py

      - name: Test BTC market data
        run: python market_data.py

      - name: Test Polymarket market data
        run: python polymarket_data.py

      - name: Test Kraken BTC 5M data
        run: python kraken_test.py

      - name: Test MEXC BTC 5M
        if: inputs.mode == 'mexc-test'
        run: |
          echo "MEXC BTC 5M TEST"
          echo "READ ONLY — NO ORDERS"
          python mexc_prediction_data.py

      - name: Test Forsee BTC 5M
        if: inputs.mode == 'forsee-test'
        env:
          FORSEE_API_KEY: ${{ secrets.FORSEE_API_KEY }}
        run: |
          echo "FORSEE BTC 5M READ-ONLY TEST"
          echo "ORDERS DISABLED — NO WALLET — PAPER ONLY"
          python forsee_prediction_data.py

      - name: Test Forsee strategy
        if: inputs.mode == 'forsee-strategy-test'
        env:
          FORSEE_API_KEY: ${{ secrets.FORSEE_API_KEY }}
        run: |
          echo "FORSEE BTC 5M STRATEGY TEST"
          echo "PAPER ONLY — NO ORDERS — NO WALLET"
          python forsee_strategy.py

      - name: Test Polymarket fee API
        if: inputs.mode == 'fee-test'
        run: |
          python - <<'PY'
          from polymarket_data import get_market_data
          from paper_live import get_fee_info

          print("=" * 60)
          print("POLYMARKET FEE API TEST")
          print("=" * 60)

          market = get_market_data()
          condition_id = market.get("condition_id")
          token_ids = market.get("token_ids") or []

          print(f"Condition ID: {condition_id}")
          print(f"Token IDs:    {token_ids}")

          if not condition_id:
              raise RuntimeError("No condition_id found")
          if not token_ids:
              raise RuntimeError("No token IDs found")

          fee_info = get_fee_info(
              condition_id=condition_id,
              token_id=token_ids[0],
          )

          if not fee_info:
              raise RuntimeError("No fee information returned")

          print("FEE INFORMATION")
          print(f"Fee rate:   {fee_info.get('fee_rate')}")
          print(f"Fee rate %: {fee_info.get('fee_rate_percent')}")
          print(f"Fee BPS:    {fee_info.get('fee_bps')}")
          print(f"Source:     {fee_info.get('source')}")
          print("FEE TEST COMPLETE")
          PY

      - name: Single paper test
        if: inputs.mode == 'single'
        run: |
          echo "SINGLE PAPER TEST"
          echo "PAPER ONLY — NO LIVE TRADING — NO REAL ORDERS"
          python paper_live.py

      - name: 2 hour paper run
        if: inputs.mode == '2hours'
        run: |
          set -e
          echo "2 HOUR PAPER TRADING RUN"
          echo "24 CHECKS — APPROXIMATELY 5 MINUTES APART"
          echo "PAPER ONLY — NO LIVE TRADING — NO REAL ORDERS"

          for i in $(seq 1 24); do
            echo "========================================"
            echo "PAPER RUN $i / 24"
            date -u
            python paper_live.py

            if [ "$i" -lt 24 ]; then
              echo "Waiting 300 seconds..."
              sleep 300
            fi
          done

          echo "2 HOUR PAPER RUN COMPLETE"

  polymarket-30m-paper:
    if: ${{ inputs.mode == 'polymarket-30m-paper' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Prepare isolated paper environment
        shell: bash
        run: |
          set -euo pipefail

          echo "POLYMARKET BTC 30-MINUTE PAPER TEST"
          echo "PAPER ONLY"
          echo "NO REAL ORDERS"
          echo "NO WALLET"
          echo "NO PRIVATE KEYS"

          grep -Fq 'LIVE_TRADING = False' paper_live.py

          RUN_DIR="$RUNNER_TEMP/polymarket-30m"
          mkdir -p "$RUN_DIR/logs"

          cp ./*.py "$RUN_DIR/"

          echo "Isolated directory prepared."
          echo "Original paper state and trades will not be copied."

      - name: Run seven checks over 30 minutes
        shell: bash
        run: |
          set -euo pipefail

          RUN_DIR="$RUNNER_TEMP/polymarket-30m"
          cd "$RUN_DIR"

          for i in 1 2 3 4 5 6 7; do
            LOG_FILE="logs/run-$(printf '%02d' "$i").log"

            {
              echo "=================================================="
              echo "CHECK $i / 7"
              date -u
              echo "PAPER ONLY — NO REAL ORDERS"
              echo "=================================================="
            } | tee "$LOG_FILE"

            if python paper_live.py 2>&1 | tee -a "$LOG_FILE"; then
              echo "CHECK $i COMPLETED" | tee -a "$LOG_FILE"
            else
              echo "CHECK $i FAILED" | tee -a "$LOG_FILE"
              exit 1
            fi

            if [ "$i" -lt 7 ]; then
              echo "Waiting 300 seconds until next check..."
              sleep 300
            fi
          done

          echo "30-MINUTE PAPER TEST COMPLETE"

      - name: Upload isolated paper test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polymarket-30m-paper-results
          path: ${{ runner.temp }}/polymarket-30m/
          if-no-files-found: warn
          retention-days: 30

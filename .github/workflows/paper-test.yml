name: Paper Trader Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run paper trader tests
        run: |
          python test_paper.py

      - name: Test live public BTC market data
        run: |
          python market_data.py

      - name: Test live public Polymarket BTC market data
        run: |
          python polymarket_data.py

      - name: Verify paper mode
        run: |
          echo "=========================================="
          echo "PAPER MODE VERIFIED"
          echo "NO REAL ORDERS"
          echo "NO API KEYS"
          echo "NO WALLET"
          echo "=========================================="

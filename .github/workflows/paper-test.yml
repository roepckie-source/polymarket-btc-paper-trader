name: Polymarket BTC Paper Trader

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Choose the paper trading run"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - 2hours

jobs:
  paper-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run strategy tests
        run: |
          python strategy.py

      - name: Run paper trader tests
        run: |
          python test_paper.py

      - name: Test market data
        run: |
          python market_data.py

      - name: Test Polymarket data
        run: |
          python polymarket_data.py

      - name: Test Kraken data
        run: |
          python kraken_test.py

      - name: Run selected paper trading session
        run: |

          echo "=================================================="
          echo "POLYMARKET BTC PAPER TRADER"
          echo "=================================================="
          echo ""
          echo "PAPER ONLY"
          echo "NO API"
          echo "NO REAL ORDERS"
          echo "NO WALLET"
          echo "NO REAL MONEY"
          echo ""

          if [ "${{ github.event.inputs.run_mode }}" = "single" ]; then

            echo "RUN MODE: SINGLE TEST"
            echo "ONE PAPER TRADING CHECK"
            echo "=================================================="
            echo ""

            python paper_live.py

            echo ""
            echo "=================================================="
            echo "SINGLE PAPER TEST COMPLETE"
            echo "=================================================="
            echo ""
            echo "PAPER ONLY - NO REAL TRADING"

          else

            echo "RUN MODE: 2 HOUR PAPER TRADING SESSION"
            echo "24 x 5-minute checks"
            echo "=================================================="
            echo ""

            for i in {1..24}; do

              echo ""
              echo "=================================================="
              echo "PAPER TRADING CHECK $i / 24"
              echo "=================================================="
              echo ""

              python paper_live.py

              if [ "$i" -lt 24 ]; then
                echo ""
                echo "Waiting 5 minutes until next 5-minute window..."
                echo ""
                sleep 300
              fi

            done

            echo ""
            echo "=================================================="
            echo "2 HOUR PAPER TRADING SESSION COMPLETE"
            echo "=================================================="
            echo ""
            echo "PAPER ONLY - NO REAL TRADING"

          fi
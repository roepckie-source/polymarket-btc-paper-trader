name: Polymarket BTC Paper Trader

on:
  workflow_dispatch:

jobs:
  paper-trader:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ======================================================
      # STRATEGY TEST
      # ======================================================

      - name: Run strategy.py
        run: python strategy.py


      # ======================================================
      # PAPER TRADER TEST SUITE
      # ======================================================

      - name: Run test_paper.py
        run: python test_paper.py


      # ======================================================
      # INITIAL MARKET DATA TEST
      # ======================================================

      - name: Run market_data.py
        run: python market_data.py


      # ======================================================
      # POLYMARKET MARKET DATA
      # ======================================================

      - name: Run polymarket_data.py
        run: python polymarket_data.py


      # ======================================================
      # KRAKEN CONTROL TEST
      # ======================================================

      - name: Run kraken_test.py
        run: python kraken_test.py


      # ======================================================
      # 30 MINUTE PAPER LIVE RUN
      # ======================================================

      - name: Run paper_live.py for 30 minutes
        run: |

          echo "=================================================="
          echo "30 MINUTE POLYMARKET BTC PAPER RUN"
          echo "=================================================="
          echo "PAPER ONLY"
          echo "NO REAL TRADING"
          echo "=================================================="
          echo ""

          for i in {1..7}
          do

            echo ""
            echo "##################################################"
            echo "PAPER LIVE RUN $i / 7"
            echo "##################################################"
            echo ""

            python paper_live.py

            if [ "$i" -lt 7 ]; then
              echo ""
              echo "Waiting 5 minutes until next 5-minute window..."
              echo ""

              sleep 300
            fi

          done

          echo ""
          echo "=================================================="
          echo "30 MINUTE PAPER RUN COMPLETE"
          echo "=================================================="


      # ======================================================
      # SAFETY INFORMATION
      # ======================================================

      - name: Paper trading safety check
        run: |
          echo "=================================================="
          echo "PAPER TRADING ONLY"
          echo "=================================================="
          echo "NO API KEYS"
          echo "NO WALLET"
          echo "NO PRIVATE KEYS"
          echo "NO REAL ORDERS"
          echo "NO REAL TRADING"
          echo "=================================================="

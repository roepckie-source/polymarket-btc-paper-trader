
name: BTC SMA200 Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "btc_sma200_backtest.py"
      - "test_btc_sma200_backtest.py"
      - ".github/workflows/btc-sma200-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas yfinance

      - name: Check project files
        run: |
          test -f btc_sma200_backtest.py
          test -f test_btc_sma200_backtest.py

      - name: Run SMA200 tests
        run: python -m unittest -v test_btc_sma200_backtest.py

      - name: Run historical backtest
        run: python btc_sma200_backtest.py

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-sma200-backtest-results
          path: |
            *.csv
            *.json
          if-no-files-found: warn
          retention-days: 30

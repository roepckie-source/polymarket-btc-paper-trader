name: OKX Spot Market Maker Paper Test

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Paper observation duration
        required: true
        default: "30"
        type: choice
        options: ["5", "15", "30", "60"]

permissions:
  contents: read

jobs:
  paper-market-maker:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Unit tests
        run: python -m unittest -v test_okx_market_maker_paper.py
      - name: Public-data paper observation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p paper-results
          export PAPER_STATE_PATH="paper-results/okx_mm_paper_state.json"
          export PAPER_TRADES_PATH="paper-results/okx_mm_paper_trades.csv"
          export EVENTS_PATH="paper-results/okx_mm_paper_events.csv"
          python okx_market_maker_paper.py --minutes "${{ inputs.minutes }}" --poll-seconds 10 2>&1 | tee paper-results/run.log
      - name: Upload paper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-market-maker-paper-results
          path: paper-results/
          if-no-files-found: warn
          retention-days: 30
